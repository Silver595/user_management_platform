name: Industry level DevSecOps CICD Pipeline

on:
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yml

jobs:
  gitleaks-scan:
    name: GitLeak Scan
    runs-on:  ubuntu-latest
    steps:
      - name: Check out Source Code
        uses: actions/checkout@v4

      - name: Run Git Leaks Scan
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          zricethezav/gitleaks:latest detect \
          --source=/repo \
          --report-format=json \
          --report-path=/repo/gitleaks-report.json \
          --redact \
          --exit-code 0

      - name: upload Git Leaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
  
  checkov-terraform:
    name: Checkov Teraaform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    setps:
      - name: Chekout Source Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: |
          checkov -d . \
          --framework terraform \
          --output json > checkov-terraform-report.json || true
      - name: Upload Checkov Terraform Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

